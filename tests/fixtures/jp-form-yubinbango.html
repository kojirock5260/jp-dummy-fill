<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>yubinbango との共存</title>
<style>
  body { font: 14px sans-serif; max-width: 640px; margin: 2em auto; }
  label { display: block; margin: .8em 0 .2em; }
  input { padding: .3em; }
  pre { background: #f4f4f4; padding: .8em; white-space: pre-wrap; }
</style>
<!--
  郵便番号→住所の補完（yubinbango）が入ったフォーム。spec §8「補完との共存」。

  期待する動き：
  1. 拡張が郵便番号を先に書く
  2. 300ms の間に yubinbango が都道府県・市区町村・町域を埋める
  3. 拡張は埋まった欄を飛ばし、町域までしか無い「町名・番地」に番地を足す
  4. 建物は補完されないので拡張が入れる
  結果、どの欄も二重にならない。

  yubinbango は外部から読む。このページを開くと GitHub Pages へ 1 回通信する。
  拡張本体は通信しない。
-->
<script src="https://yubinbango.github.io/yubinbango/yubinbango.js" charset="UTF-8"></script>
<form class="h-adr">
  <span class="p-country-name" style="display:none;">Japan</span>

  <label>氏名</label>
  <input name="name">

  <label>郵便番号</label>
  <input name="zip" class="p-postal-code" maxlength="8">

  <label>都道府県</label>
  <input name="pref" class="p-region">

  <label>市区町村</label>
  <input name="city" class="p-locality">

  <label>町名・番地</label>
  <input name="address1" class="p-street-address" size="40">

  <label>建物名</label>
  <input name="address2" class="p-extended-address" size="40">

  <p><button type="button" id="show">値を表示</button></p>
  <pre id="out"></pre>
</form>
<script>
  document.getElementById("show").addEventListener("click", () => {
    const rows = [...document.querySelectorAll("input")].map((e) => `${e.name} = ${e.value}`);
    document.getElementById("out").textContent = rows.join("\n");
  });
</script>
</html>
